[package]
name = "ariane"
version = "0.8.17"
description = "Ariane, explorateur de fichiers coloré, avec espaces, tags et état Git"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ariane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dossiers standards (Téléchargements, Bureau…) sous Linux (XDG) et Windows
dirs = "6"
# Corbeille native : freedesktop sous Linux, Corbeille Windows
trash = "5"
# Ouvrir un fichier avec l'application par défaut
open = "5"
# Mises à jour : vérifie, télécharge et installe les nouvelles versions signées
tauri-plugin-updater = "2"
# Archives : extraire et créer des .zip, extraire des .tar / .tar.gz
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# Actualisation automatique : changements dans les dossiers affichés (inotify, ReadDirectoryChangesW)
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Linux uniquement : partages réseau montés par GNOME, avec sa fenêtre de connexion (déjà compilé pour Tauri)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Wayland : donner le jeton d'activation à l'écran, pour passer au premier plan (déjà compilé pour Tauri)
gdkwayland-sys = "0.18"

# Windows uniquement : lecture du registre (launchers de jeux) et encodage des icônes
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
base64 = "0.22"
# Clés USB et disques externes (lecteurs, bus, éjection), connexion aux partages réseau
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_NetworkManagement_WNet",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }
# Jauge OneDrive : la même interface que l'Explorateur (déjà compilé pour Tauri)
windows = { version = "0.61", features = ["Storage_Provider", "Win32_System_Com"] }
